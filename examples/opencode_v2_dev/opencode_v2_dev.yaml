hw:
  cpus: 2
  mem_mib: 4096
  rootfs_mib: 4096

mounts:
  # Every project OpenCode may open: run terra from the folder that holds them.
  - host: .
    guest: /projects
  # OpenCode's config (opencode.json, agents, commands), editable on the host. Kept by `terra rm`.
  - host: ./.opencode
    guest: /config/opencode

volumes:
  # OpenCode's sessions, sign-ins and state. Survives `setup --rebuild`.
  - name: opencode
    guest: /opencode
    size_mib: 2048

env:
  # Point OpenCode's config dir at the mount, and its data, state and cache dirs at the volume.
  XDG_CONFIG_HOME: /config
  XDG_DATA_HOME: /opencode/data
  XDG_STATE_HOME: /opencode/state
  XDG_CACHE_HOME: /opencode/cache

network:
  mode: unrestricted-public
  ports:
    - "4096" # web UI at http://127.0.0.1:4096, after `opencode pair`

hooks:
  on_create:
    - apk add --no-cache bash ca-certificates curl git nodejs npm ripgrep
    # Its postinstall script picks the native musl binary.
    - npm install -g @opencode/cli@latest
  on_start:
    - chown terri:terri /opencode

workload:
  # The shared server every TUI, CLI and browser client in the box connects to.
  entrypoint: /usr/local/bin/opencode
  args: ["serve", "--service", "--hostname", "0.0.0.0", "--port", "4096"]
  workdir: /projects
